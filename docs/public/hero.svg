<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="IoT Deck 设备节点网络示意图">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.35" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="28" fill="#0b1220" />
  <rect x="0" y="0" width="400" height="400" rx="28" fill="url(#grid)" />
  <rect x="0.75" y="0.75" width="398.5" height="398.5" rx="27" fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- 端云链路 -->
  <g fill="none" stroke="url(#link)" stroke-width="1.6">
    <path d="M200 200 L96 88" />
    <path d="M200 200 L316 104" />
    <path d="M200 200 L330 262" />
    <path d="M200 200 L84 292" />
    <path d="M200 200 L200 344" />
  </g>

  <!-- 中心：平台 / 网关 -->
  <circle cx="200" cy="200" r="56" fill="#38bdf8" fill-opacity="0.10" />
  <circle cx="200" cy="200" r="38" fill="#38bdf8" fill-opacity="0.16" />
  <circle cx="200" cy="200" r="22" fill="url(#core)" />
  <circle cx="200" cy="200" r="22" fill="none" stroke="#e0f2fe" stroke-opacity="0.55" stroke-width="1.2" />

  <!-- 周边设备节点 -->
  <g>
    <circle cx="96" cy="88" r="15" fill="#131f33" stroke="#38bdf8" stroke-width="2" />
    <circle cx="96" cy="88" r="5" fill="#38bdf8" />

    <circle cx="316" cy="104" r="15" fill="#131f33" stroke="#34d399" stroke-width="2" />
    <circle cx="316" cy="104" r="5" fill="#34d399" />

    <circle cx="330" cy="262" r="15" fill="#131f33" stroke="#fbbf24" stroke-width="2" />
    <circle cx="330" cy="262" r="5" fill="#fbbf24" />

    <circle cx="84" cy="292" r="15" fill="#131f33" stroke="#38bdf8" stroke-width="2" />
    <circle cx="84" cy="292" r="5" fill="#38bdf8" />

    <circle cx="200" cy="344" r="15" fill="#131f33" stroke="#f87171" stroke-width="2" />
    <circle cx="200" cy="344" r="5" fill="#f87171" />
  </g>

  <!-- 上行报文脉冲 -->
  <g fill="#e0f2fe">
    <circle cx="132" cy="126" r="3.2" />
    <circle cx="266" cy="140" r="3.2" />
    <circle cx="276" cy="228" r="3.2" />
    <circle cx="122" cy="252" r="3.2" />
  </g>
</svg>
